name: runner-image-candidate

on:
  pull_request:
    paths:
      - .github/workflows/runner-image.yml
      - deploy/runner/image/**
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character main commit to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build minimal linux-amd64 image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the digest-pinned candidate
        run: >-
          docker build
          --platform=linux/amd64
          --tag=codex-cloud-task-scheduler-runner:candidate
          --file=deploy/runner/image/Dockerfile
          deploy/runner/image
      - name: Verify identity, size, and fixed tool boundary
        run: |
          set -eu
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' codex-cloud-task-scheduler-runner:candidate)" = linux/amd64
          size="$(docker image inspect --format '{{.Size}}' codex-cloud-task-scheduler-runner:candidate)"
          test "$size" -le 1073741824
          echo "image_id=$(docker image inspect --format '{{.Id}}' codex-cloud-task-scheduler-runner:candidate)"
          echo "image_size_bytes=$size"
          echo "image_layer_count=$(docker image inspect --format '{{len .RootFS.Layers}}' codex-cloud-task-scheduler-runner:candidate)"
          docker run --rm --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=128 \
            --memory=536870912 \
            --memory-swap=536870912 \
            --cpus=1.0 \
            --tmpfs=/tmp:rw,nosuid,nodev,mode=1777,size=67108864 \
            --entrypoint=/bin/sh \
            codex-cloud-task-scheduler-runner:candidate -ceu '
              test "$(python3 -c '\''import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'\'')" = 3.12
              test "$(node -p '\''process.versions.node.split(".")[0]'\'')" = 22
              python3 -m pip --version
              test "$(npm --version)" = 11.19.0
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/balanced-match/package.json").version'\'')" = 4.0.4
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/brace-expansion/package.json").version'\'')" = 5.0.9
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/ip-address/package.json").version'\'')" = 10.3.1
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/tinyglobby/node_modules/picomatch/package.json").version'\'')" = 4.0.4
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/sigstore/package.json").version'\'')" = 4.1.1
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/tar/package.json").version'\'')" = 7.5.19
              npx --version
              git --version
              curl --version
              rg --version
              patch --version
              timeout --version
              for forbidden in bun cargo docker dotnet gcc g++ go gradle java javac make mvn php ruby rustc sudo swift; do
                ! command -v "$forbidden"
              done
            '

  publish:
    name: manually publish exact main candidate
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: runner-image-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_REPOSITORY: ghcr.io/longwdl/codex-cloud-task-scheduler-runner
    steps:
      - name: Validate exact default-branch request
        env:
          ACTUAL_COMMIT: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -eu
          test "$ACTUAL_REF" = refs/heads/main
          test "${#EXPECTED_COMMIT}" -eq 40
          printf '%s\n' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_COMMIT" = "$ACTUAL_COMMIT"
      - name: Check out the exact main commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and recheck the exact candidate
        env:
          ACTUAL_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          image_ref="$IMAGE_REPOSITORY:sha-$ACTUAL_COMMIT"
          docker build \
            --platform=linux/amd64 \
            --tag="$image_ref" \
            --file=deploy/runner/image/Dockerfile \
            deploy/runner/image
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")" = linux/amd64
          size="$(docker image inspect --format '{{.Size}}' "$image_ref")"
          test "$size" -le 1073741824
          docker run --rm --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=128 \
            --memory=536870912 \
            --memory-swap=536870912 \
            --cpus=1.0 \
            --tmpfs=/tmp:rw,nosuid,nodev,mode=1777,size=67108864 \
            --entrypoint=/bin/sh \
            "$image_ref" -ceu '
              test "$(python3 -c '\''import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'\'')" = 3.12
              test "$(node -p '\''process.versions.node.split(".")[0]'\'')" = 22
              python3 -m pip --version
              test "$(npm --version)" = 11.19.0
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/balanced-match/package.json").version'\'')" = 4.0.4
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/brace-expansion/package.json").version'\'')" = 5.0.9
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/ip-address/package.json").version'\'')" = 10.3.1
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/tinyglobby/node_modules/picomatch/package.json").version'\'')" = 4.0.4
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/sigstore/package.json").version'\'')" = 4.1.1
              test "$(node -p '\''require("/usr/local/lib/node_modules/npm/node_modules/tar/package.json").version'\'')" = 7.5.19
              npx --version
              git --version
              curl --version
              rg --version
              patch --version
              timeout --version
              for forbidden in bun cargo docker dotnet gcc g++ go gradle java javac make mvn php ruby rustc sudo swift; do
                ! command -v "$forbidden"
              done
            '
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$image_ref")"
          echo "image_size_bytes=$size"
          echo "image_layer_count=$(docker image inspect --format '{{len .RootFS.Layers}}' "$image_ref")"
      - name: Authenticate with the ephemeral workflow token
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/codex-runner-publisher-${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          mkdir "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the commit-only candidate tag
        env:
          ACTUAL_COMMIT: ${{ github.sha }}
          DOCKER_CONFIG: ${{ runner.temp }}/codex-runner-publisher-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          image_ref="$IMAGE_REPOSITORY:sha-$ACTUAL_COMMIT"
          docker push "$image_ref"
      - name: Pull back and record the exact RepoDigest
        env:
          ACTUAL_COMMIT: ${{ github.sha }}
          DOCKER_CONFIG: ${{ runner.temp }}/codex-runner-publisher-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:sha-$ACTUAL_COMMIT"
          docker image rm "$image_ref"
          docker pull --platform=linux/amd64 "$image_ref"
          repo_digest="$(
            docker image inspect --format '{{json .RepoDigests}}' "$image_ref" |
              jq -er --arg prefix "$IMAGE_REPOSITORY@sha256:" '
                [.[] | select(startswith($prefix))]
                | unique
                | select(length == 1)
                | .[0]
              '
          )"
          digest="${repo_digest#"$IMAGE_REPOSITORY@sha256:"}"
          test "$digest" != "$repo_digest"
          printf '%s\n' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          docker pull --platform=linux/amd64 "$repo_digest"
          pulled_digest="$(
            docker image inspect --format '{{json .RepoDigests}}' "$repo_digest" |
              jq -er --arg prefix "$IMAGE_REPOSITORY@sha256:" '
                [.[] | select(startswith($prefix))]
                | unique
                | select(length == 1)
                | .[0]
              '
          )"
          test "$pulled_digest" = "$repo_digest"
          echo "repo_digest=$repo_digest"
          echo "pulled_image_id=$(docker image inspect --format '{{.Id}}' "$repo_digest")"
          echo "pulled_image_size_bytes=$(docker image inspect --format '{{.Size}}' "$repo_digest")"
          echo "pulled_image_layer_count=$(docker image inspect --format '{{len .RootFS.Layers}}' "$repo_digest")"
      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/codex-runner-publisher-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          docker logout ghcr.io >/dev/null 2>&1 || true
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/codex-runner-publisher-*) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$DOCKER_CONFIG"
