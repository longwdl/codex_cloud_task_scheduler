# Dedicated forced-command account for the low-trust Codex Runner.
# Install as /etc/ssh/sshd_config.d/60-codex-runner.conf, root:root 0644.
Match User codex-runner
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/authorized_keys/codex-runner
    ForceCommand /srv/codex-runner/bin/codex-runner-v1
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no

Match all
