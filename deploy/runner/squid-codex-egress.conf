# Complete Squid configuration for the audited Runner proxy.
# Install as /etc/squid/codex-egress.conf, root:proxy 0640.

visible_hostname codex-egress-proxy
cache_effective_user proxy
pinger_enable off
http_port 127.0.0.1:3128
icp_port 0
htcp_port 0

acl runner_client src 127.0.0.1/32 ::1/128
acl connect_method method CONNECT
acl tls_port port 443
acl canonical_connect url_regex -i ^[a-z0-9][a-z0-9.-]*:443$
acl hostname_connect url_regex -i ^[a-z0-9.-]*[a-z][a-z0-9.-]*:443$

acl blocked_destination dst 0.0.0.0/8
acl blocked_destination dst 10.0.0.0/8
acl blocked_destination dst 100.64.0.0/10
acl blocked_destination dst 127.0.0.0/8
acl blocked_destination dst 169.254.0.0/16
acl blocked_destination dst 172.16.0.0/12
acl blocked_destination dst 192.0.0.0/24
acl blocked_destination dst 192.0.2.0/24
acl blocked_destination dst 192.88.99.0/24
acl blocked_destination dst 192.168.0.0/16
acl blocked_destination dst 198.18.0.0/15
acl blocked_destination dst 198.51.100.0/24
acl blocked_destination dst 203.0.113.0/24
acl blocked_destination dst 224.0.0.0/4
acl blocked_destination dst 240.0.0.0/4
acl blocked_destination dst ::/128
acl blocked_destination dst ::1/128
acl blocked_destination dst 64:ff9b::/96
acl blocked_destination dst 64:ff9b:1::/48
acl blocked_destination dst 100::/64
acl blocked_destination dst 2001::/23
acl blocked_destination dst 2001:db8::/32
acl blocked_destination dst 2002::/16
acl blocked_destination dst 3fff::/20
acl blocked_destination dst fc00::/7
acl blocked_destination dst fec0::/10
acl blocked_destination dst fe80::/10
acl blocked_destination dst ff00::/8
acl site_blocked_destination dst "/etc/squid/codex-egress-blocked-destinations.conf"
acl approved_domain dstdomain "/etc/squid/codex-egress-allowed-domains.conf"

http_access deny !runner_client
http_access deny !connect_method
http_access deny !tls_port
http_access deny !canonical_connect
http_access deny !hostname_connect
http_access deny blocked_destination
http_access deny site_blocked_destination
http_access allow approved_domain
http_access deny all

cache deny all
forwarded_for delete
request_header_access Proxy-Authorization deny all
request_header_access Authorization deny all

logformat codex_egress ts=%ts.%03tu src=%>a result=%Ss/%03>Hs in=%>st out=%<st elapsed_ms=%tr method=%rm dst=%>rd:%>rP
access_log stdio:/var/log/squid/codex-egress-access.log logformat=codex_egress rotate=0 on-error=die
cache_log /var/log/squid/codex-egress-cache.log
cache_store_log none
pid_filename /run/squid/codex-egress.pid
logfile_rotate 0
shutdown_lifetime 2 seconds
