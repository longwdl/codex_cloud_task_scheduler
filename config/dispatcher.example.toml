[scheduler]
poll_interval_seconds = 120
global_max_active = 1
database_path = "/var/lib/codex-dispatcher/state.db"
workspace_root = "/var/lib/codex-dispatcher/repos"
# Archived/absence-reconciled WorkItems are skipped between these full GitHub
# drift audits. Any failed full audit leaves the cursor unchanged and retries.
terminal_full_scan_interval_seconds = 86400

[tools]
git_version = "2.55.0"
gh_version = "2.97.0"
codex_version = "0.147.0"
ssh_version = "9.6"

[ssh_runtime]
git_path = "/usr/bin/git"
gh_path = "/usr/bin/gh"
ssh_path = "/usr/bin/ssh"
host = "runner.internal"
user = "codex"
port = 22
known_hosts_path = "/etc/codex-dispatcher/runner_known_hosts"
identity_file = "/etc/codex-dispatcher/runner_ed25519"
lock_path = "/run/codex-dispatcher/dispatcher.lock"
mirror_root = "/var/lib/codex-dispatcher/mirrors"
source_temporary_root = "/var/lib/codex-dispatcher/source-temporary"
quarantine_root = "/var/lib/codex-dispatcher/quarantine"
publisher_temporary_root = "/var/lib/codex-dispatcher/publisher-temporary"
runner_root = "/srv/codex-runner/work-items"
connect_timeout_seconds = 10
operation_timeout_seconds = 3900
# Omit to disable automatic reclamation. Seven days is the reviewed default.
completed_retention_seconds = 604800
# Terminal Issues remain OPEN indefinitely as the durable audit entry point.
# Only exact terminal task branches become deletion candidates after this delay.
terminal_branch_retention_seconds = 2592000

